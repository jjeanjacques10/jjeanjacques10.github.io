<footer class="blog-footer">
  <div class="blog-footer__inner">
    <span class="footer-copyright">{{ with .Site.Copyright }}{{ . | markdownify }}{{ end }}</span>
    <div class="footer-links">
      <a href="/privacy/" class="footer-link">Privacy</a>
      <a href="/terms/" class="footer-link">Terms</a>
    </div>
    <div class="footer-social">
      {{- with .Site.Params.github }}
      <a href="https://github.com/{{ . }}" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      {{- end }}
      {{- with .Site.Params.twitter }}
      <a href="https://twitter.com/{{ . }}" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      {{- end }}
      {{- with .Site.Params.medium }}
      <a href="https://{{ . }}.medium.com" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Medium">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/></svg>
      </a>
      {{- end }}
    </div>
  </div>
  {{- if .Site.Params.showFooterCredits }}
  <div class="blog-footer__credits">
    Powered by <a href="https://github.com/qqhann/hugo-primer" target="_blank" rel="noopener noreferrer">Hugo Primer Blog</a>
  </div>
  {{- end }}
</footer>

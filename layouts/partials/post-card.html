<article class="post-card">
  <div class="post-card__body">
    {{- with .Params.cover }}
    <a href="{{ $.RelPermalink }}" class="post-card__thumb" aria-hidden="true" tabindex="-1">
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
    </a>
    {{- end }}
    <div class="post-card__content">
      <h3 class="post-card__title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h3>
      {{- with .Params.tags }}
      <div class="post-card__tags">
        {{- range . }}
        <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}" class="tag-badge">{{ . }}</a>
        {{- end }}
      </div>
      {{- end }}
      <p class="post-card__desc">{{ .Summary | plainify | truncate 200 }}</p>
    </div>
  </div>
  <div class="post-card__footer">
    <button
      class="save-post-btn post-card__save-btn"
      type="button"
      data-url="{{ .RelPermalink }}"
      data-title="{{ .Title | htmlEscape }}"
      aria-pressed="false"
      aria-label="Salvar post para ler depois"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="save-btn-label">Salvar</span>
    </button>
    <time class="post-card__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
  </div>
</article>

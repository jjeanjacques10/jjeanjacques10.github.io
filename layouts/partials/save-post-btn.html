<div class="social-share save-post-wrap">
  <span class="social-share__label">Salvar:</span>
  <button
    class="social-share__btn save-post-btn"
    type="button"
    data-url="{{ .RelPermalink }}"
    data-title="{{ .Title | htmlEscape }}"
    aria-pressed="false"
    aria-label="Salvar post para ler depois"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="save-btn-label">Salvar</span>
  </button>
</div>

{{ define "title" }}{{ .Title }} – {{ .Site.Title }}{{ end }}

{{ define "main" }}
<article class="post-single about-single">
  <header class="post-header about-header">
    {{- with .Params.profileImage }}
    <div class="about-profile">
      <img src="{{ . }}" alt="{{ $.Params.profileImageAlt | default $.Title }}" loading="lazy">
    </div>
    {{- end }}
    <div class="about-header__content">
      <h1 class="post-title">{{ .Title }}</h1>
      {{- with .Description }}
      <p class="about-description">{{ . }}</p>
      {{- end }}
    </div>
  </header>

  <div class="post-content markdown-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
